version: 1

project:
  name: gojo
  defaultBranch: main

repository:
  remote: origin
  syncBeforeRun: true
  requireCleanBase: true
  submodules: false
  gitLfs: false

instructions:
  files:
    - .gojo/instructions.md
  scheduledRunNotice: |
    Unattended scheduled gojo run. Prefer small diffs. Write .gojo/handoff.json before exiting.

profiles:
  shell:
    adapter: shell
    timeout: 5m
  cursor:
    adapter: cursor
    model: default
    timeout: 45m

validationProfiles:
  self-heal:
    steps:
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  typecheck:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
  # Typecheck + unit/integration tests. Coverage % is never a fail gate.
  daemon-unit:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
      - name: test
        command: bash scripts/with-bun.sh bun test
        timeout: 15m
  # Same pass/fail as daemon-unit, plus an informational coverage report.
  daemon-test:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
      - name: test-coverage
        command: bash scripts/daemon-coverage.sh
        timeout: 15m
  full-check:
    steps:
      - name: ci-check
        command: bash scripts/ci-check.sh
        timeout: 25m
  docs-build:
    steps:
      - name: site-build
        command: bash scripts/with-bun.sh bun run --cwd site build
        timeout: 5m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  noop:
    steps:
      - name: noop
        command: "true"
        timeout: 30s
  handoff:
    steps:
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s

agents:
  self-heal:
    description: Diagnose failed gojo runs and open a reviewable fix PR
    profile: cursor
    promptFile: .gojo/agents/self-heal.md
    validationProfile: self-heal
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: none

  maintain-quality:
    description: Refactor for module boundaries, low complexity, and expert TypeScript quality
    profile: cursor
    promptFile: .gojo/agents/maintain-quality.md
    validationProfile: daemon-unit
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      agent: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-tests:
    description: Raise daemon/CLI test coverage toward 95% without product features
    profile: cursor
    promptFile: .gojo/agents/maintain-tests.md
    validationProfile: daemon-test
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      agent: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-deps:
    description: Update dependencies including majors; keep build and tests green
    profile: cursor
    promptFile: .gojo/agents/maintain-deps.md
    validationProfile: full-check
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      agent: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-docs:
    description: Keep site/ and docs/ aligned with implemented behavior
    profile: cursor
    promptFile: .gojo/agents/maintain-docs.md
    validationProfile: docs-build
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      agent: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-issue-tags:
    description: Ensure GitHub label taxonomy and triage issue tags (no code changes)
    profile: cursor
    promptFile: .gojo/agents/maintain-issue-tags.md
    validationProfile: noop
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential

  issue-triage:
    description: Validate ready issues before implementation
    profile: cursor
    promptFile: .gojo/agents/issue-triage.md
    validationProfile: handoff
    trigger:
      on: issue-label
      requireLabels: [gojo:ready]
      excludeLabels: [gojo:validated, gojo:blocked, gojo:in-progress]
      trustedActors: [detroitpro]
      maxOpenClaims: 1
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential

  issue-implement:
    description: Implement validated issues and open reviewable pull requests
    profile: cursor
    promptFile: .gojo/agents/issue-implement.md
    validationProfile: full-check
    trigger:
      on: issue-label
      requireLabels: [gojo:ready, gojo:validated]
      excludeLabels: [gojo:blocked, gojo:in-progress]
      trustedActors: [detroitpro]
      maxOpenClaims: 1
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      approval: reviewer
      autonomyLabels:
        auto: gojo:auto-merge
      fixRounds: 2
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential

  issue-review:
    description: Review agent pull requests after source checks settle
    profile: cursor
    promptFile: .gojo/agents/issue-review.md
    validationProfile: handoff
    trigger:
      on: pull-request-checks-settled
      fromAgents:
        - self-heal
        - maintain-quality
        - maintain-tests
        - maintain-deps
        - maintain-docs
        - issue-implement
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential

  activity-digest:
    description: Daily executive brief on what shipped in the last 24h and why it matters
    profile: cursor
    promptFile: .gojo/agents/activity-digest.md
    validationProfile: handoff
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential
    notifications:
      onSuccess:
        - ghost
      onFailure:
        - ghost

schedules:
  self-heal:
    agent: self-heal
    cron: "0 7 * * *"
    timezone: America/Detroit
  maintain-quality:
    agent: maintain-quality
    cron: "0 2 * * *"
    timezone: America/Detroit
  maintain-tests:
    agent: maintain-tests
    cron: "0 3 * * *"
    timezone: America/Detroit
  maintain-deps:
    agent: maintain-deps
    cron: "0 2 * * 0"
    timezone: America/Detroit
  maintain-docs:
    agent: maintain-docs
    cron: "0 4 * * *"
    timezone: America/Detroit
  maintain-issue-tags:
    agent: maintain-issue-tags
    cron: "30 5 * * *"
    timezone: America/Detroit
  activity-digest:
    agent: activity-digest
    cron: "0 8 * * *"
    timezone: America/Detroit

notifications:
  onApprovalNeeded:
    - ghost
