version: 1

project:
  name: gojo
  defaultBranch: main

repository:
  remote: origin
  syncBeforeRun: true
  requireCleanBase: true
  submodules: false
  gitLfs: false

instructions:
  files:
    - .gojo/instructions.md
  scheduledRunNotice: |
    Unattended scheduled gojo run. Prefer small diffs. Write .gojo/handoff.json before exiting.

agents:
  shell:
    adapter: shell
    timeout: 5m
  cursor:
    adapter: cursor
    model: default
    timeout: 45m

validationProfiles:
  self-heal:
    steps:
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  typecheck:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
  # Typecheck + unit/integration tests. Coverage % is never a fail gate.
  daemon-unit:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
      - name: test
        command: bash scripts/with-bun.sh bun test
        timeout: 15m
  # Same pass/fail as daemon-unit, plus an informational coverage report.
  daemon-test:
    steps:
      - name: typecheck
        command: bash scripts/with-bun.sh bun run typecheck
        timeout: 5m
      - name: test-coverage
        command: bash scripts/daemon-coverage.sh
        timeout: 15m
  full-check:
    steps:
      - name: ci-check
        command: bash scripts/ci-check.sh
        timeout: 25m
  docs-build:
    steps:
      - name: site-build
        command: bash scripts/with-bun.sh bun run --cwd site build
        timeout: 5m
      - name: handoff-exists
        command: test -f .gojo/handoff.json
        timeout: 30s
  noop:
    steps:
      - name: noop
        command: "true"
        timeout: 30s

tasks:
  self-heal:
    description: Diagnose failed gojo runs and open a reviewable fix PR
    agent: cursor
    promptFile: .gojo/tasks/self-heal.md
    validationProfile: self-heal
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: none

  maintain-quality:
    description: Refactor for module boundaries, low complexity, and expert TypeScript quality
    agent: cursor
    promptFile: .gojo/tasks/maintain-quality.md
    validationProfile: daemon-unit
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      task: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-tests:
    description: Raise daemon/CLI test coverage toward 95% without product features
    agent: cursor
    promptFile: .gojo/tasks/maintain-tests.md
    validationProfile: daemon-test
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      task: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-deps:
    description: Update dependencies including majors; keep build and tests green
    agent: cursor
    promptFile: .gojo/tasks/maintain-deps.md
    validationProfile: full-check
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      task: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-docs:
    description: Keep site/ and docs/ aligned with implemented behavior
    agent: cursor
    promptFile: .gojo/tasks/maintain-docs.md
    validationProfile: docs-build
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: pull-request
      targetBranch: main
      prTool: gh
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 2
      disableAfterConsecutiveFailedRuns: 3
      backoff: exponential
    selfHeal:
      task: self-heal
      afterConsecutiveFailedRuns: 1

  maintain-merge:
    description: Babysit and merge open maintenance PRs from gojo scheduled agents
    agent: cursor
    promptFile: .gojo/tasks/maintain-merge.md
    validationProfile: noop
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    integration:
      mode: commit-only
      targetBranch: main
      requireAllValidations: true
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential

  maintain-issue-tags:
    description: Ensure GitHub label taxonomy and triage issue tags (no code changes)
    agent: cursor
    promptFile: .gojo/tasks/maintain-issue-tags.md
    validationProfile: noop
    concurrency:
      projectLimit: 1
      overlapPolicy: skip
    failurePolicy:
      maxAttemptsPerRun: 1
      disableAfterConsecutiveFailedRuns: 5
      backoff: exponential

schedules:
  self-heal:
    task: self-heal
    cron: "0 7 * * *"
    timezone: America/Detroit
  maintain-quality:
    task: maintain-quality
    cron: "0 2 * * *"
    timezone: America/Detroit
  maintain-tests:
    task: maintain-tests
    cron: "0 3 * * *"
    timezone: America/Detroit
  maintain-deps:
    task: maintain-deps
    cron: "0 2 * * 0"
    timezone: America/Detroit
  maintain-docs:
    task: maintain-docs
    cron: "0 4 * * *"
    timezone: America/Detroit
  maintain-merge:
    task: maintain-merge
    cron: "0 6 * * *"
    timezone: America/Detroit
  maintain-issue-tags:
    task: maintain-issue-tags
    cron: "30 5 * * *"
    timezone: America/Detroit

notifications: {}
